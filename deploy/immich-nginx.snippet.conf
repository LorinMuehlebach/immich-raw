# Add to the nginx that serves your Immich domain.
# - /immich-raw/ goes to the editor container.
# - /immich-raw/culler/ goes to the culler container (optional: auto-stacking and best-pick).
# - Every other path goes to Immich as before; Immich's HTML pages get the "Edit RAW" button script.
# Replace immich-raw / immich-server with the container names or addresses in your setup.

# --- http {} level (a file in conf.d/ is already inside http {}) ---------------------------------
# sub_filter can't edit compressed responses, so HTML pages are requested from Immich uncompressed.
# Assets (/_app/) and API calls (/api/) keep compression.
map $uri $immich_accept_encoding {
  ~^/(_app|api)/ $http_accept_encoding;
  default "";
}

# --- inside the server {} block for your Immich domain -------------------------------------------
server {
  listen 443 ssl;
  server_name immich.example.com;
  # ssl_certificate ...;  (your existing TLS settings)

  client_max_body_size 50000M;

  # With Docker, use its DNS and a variable in proxy_pass, so nginx finds containers again after
  # they restart. Outside Docker, remove the resolver and put the address in proxy_pass directly.
  resolver 127.0.0.11 valid=10s;
  set $raw_editor http://immich-raw:80;
  set $immich http://immich-server:2283;
  set $culler http://immich-culler:8080;

  # Optional: remove if you don't run the culler. Without it the editor hides its controls.
  location /immich-raw/culler/ {
    proxy_pass $culler;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /immich-raw/ {
    proxy_pass $raw_editor;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass $immich;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Accept-Encoding $immich_accept_encoding;
    sub_filter '</head>' '<script defer src="/immich-raw/inject.js"></script></head>';
    sub_filter_once on;
    sub_filter_types text/html;
  }
}
