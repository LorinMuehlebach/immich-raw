# nginx inside the editor container. Serves the built editor at /immich-raw/.
# It must be reached through the same host as Immich (see immich-nginx.snippet.conf),
# so the editor can use the Immich login cookie and call /api without CORS.

server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # The lens database (lensfun/lensfun.json, 1.3 MB) and the scripts compress well.
  gzip on;
  gzip_types application/json application/javascript text/javascript text/css application/wasm;
  gzip_min_length 1024;
  gzip_comp_level 6;

  # The RAW decoder (WASM with threads) needs a cross-origin isolated page.
  # add_header in a location replaces the server-level ones, so every location repeats them.
  set $coop "same-origin";
  set $coep "require-corp";
  set $corp "same-origin";

  location = /immich-raw {
    return 301 /immich-raw/;
  }

  # Hashed build output: cache for a year.
  location /immich-raw/assets/ {
    add_header Cross-Origin-Opener-Policy $coop always;
    add_header Cross-Origin-Embedder-Policy $coep always;
    add_header Cross-Origin-Resource-Policy $corp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html, inject.js and other unhashed files: always revalidate.
  location /immich-raw/ {
    add_header Cross-Origin-Opener-Policy $coop always;
    add_header Cross-Origin-Embedder-Policy $coep always;
    add_header Cross-Origin-Resource-Policy $corp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /immich-raw/index.html;
  }

  location / {
    return 404;
  }
}
