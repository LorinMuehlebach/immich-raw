# Throwaway Immich for spikes and end-to-end tests. Not for real photos.
#   docker compose -f e2e/docker-compose.immich.yml up -d
#   IMMICH_HELMET_FILE=true docker compose -f e2e/docker-compose.immich.yml up -d   # CSP-on variant
#   docker compose -f e2e/docker-compose.immich.yml down -v                          # delete everything
# Open http://127.0.0.1:8088 (nginx in front of Immich; /immich-raw/ is served from RAW_EDITOR_DIR,
# default: the built editor in ../apps/editor/dist). See e2e/README.md.
# Images and digests match Immich's official v3.4.0 docker-compose.yml. Machine learning is left out.
# The culler (services/culler) starts only with a profile and an API key:
#   CULLER_API_KEY=<key> docker compose -f e2e/docker-compose.immich.yml --profile culler up -d --build culler
name: immich-raw-editor-e2e

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.0
    volumes:
      - library:/data
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_HELMET_FILE: ${IMMICH_HELMET_FILE:-false}
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

  culler:
    profiles: [culler]
    build: ../services/culler
    environment:
      IMMICH_URL: http://immich-server:2283
      IMMICH_API_KEY: ${CULLER_API_KEY:-}
      CULLER_WATCH: ${CULLER_WATCH:-false}
      CULLER_WATCH_QUIET: ${CULLER_WATCH_QUIET:-300}
      CULLER_WEBHOOK_SECRET: ${CULLER_WEBHOOK_SECRET:-}
    volumes:
      - culler:/data
    depends_on:
      - immich-server
    restart: unless-stopped

  proxy:
    image: docker.io/library/nginx:1.29-alpine
    ports:
      - '127.0.0.1:8088:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${RAW_EDITOR_DIR:-../apps/editor/dist}:/usr/share/nginx/immich-raw:ro
    depends_on:
      - immich-server
    restart: unless-stopped

# Named volumes keep the library and database out of the (OneDrive-synced) repo folder.
volumes:
  library:
  postgres:
  culler:
