# Same-origin deployment: /immich-raw/ is the editor, everything else is Immich.
# Immich's HTML gets the inject script added before </head>.

# sub_filter can't rewrite compressed responses, so HTML requests reach Immich without
# Accept-Encoding. Assets (/_app/) and API responses (/api/) keep compression.
map $uri $immich_accept_encoding {
  ~^/(_app|api)/ $http_accept_encoding;
  default "";
}

server {
  listen 80;
  client_max_body_size 0;
  # Docker's DNS; with a variable in proxy_pass nginx re-resolves immich-server after restarts.
  resolver 127.0.0.11 valid=10s;
  set $immich_upstream http://immich-server:2283;
  # The culler only runs with `--profile culler`; without it this route answers 502, which the
  # editor treats as "not installed".
  set $culler_upstream http://culler:8080;

  location /immich-raw/culler/ {
    proxy_pass $culler_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /immich-raw/ {
    alias /usr/share/nginx/immich-raw/;
    gzip on;
    gzip_types application/json application/javascript text/javascript text/css application/wasm;
    gzip_comp_level 6;
    # Required by the libraw-wasm pthreads build (SharedArrayBuffer).
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control no-cache always;
  }

  location / {
    proxy_pass $immich_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding $immich_accept_encoding;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    sub_filter '</head>' '<script defer src="/immich-raw/inject.js"></script></head>';
    sub_filter_once on;
    sub_filter_types text/html;
  }
}
