[project]
name = "immich-culler"
version = "0.1.0"
description = "Stacks similar photos in Immich, picks the best one and tags why the others lost"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "mediapipe>=0.10.20",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.10",
  "rawpy>=0.24",
  "uvicorn>=0.32",
]

[project.scripts]
culler = "culler.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "culler"

[tool.uv]
# mediapipe depends on the GUI build of OpenCV (needs libGL in Docker, and clashes with the headless
# build over the same `cv2` module). The headless build provides everything used here.
override-dependencies = ["opencv-contrib-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`",
  "ignore:Setting per-request cookies",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends"]
